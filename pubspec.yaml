name: pure_o_fresh_rider_app
description: A new Flutter project.
publish_to: "none"

version: 4.0.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  audioplayers: ^6.0.0
  carousel_slider: ^5.0.0
  circular_countdown_timer: ^0.2.3
  cupertino_icons: ^1.0.2
  dio: ^5.3.2
  dotted_border: ^2.0.0+3
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_dash: ^1.0.0
  flutter_rating_bar: ^4.0.1
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.7
  flutter_swipe_button: ^2.1.1+1
  geolocator: ^12.0.0
  google_fonts: ^8.1.0
  image_picker: ^1.0.2
  loadmore: ^2.1.0
  map_launcher: ^3.3.0
  permission_handler: ^11.0.0
  pin_code_fields: ^8.0.1
  pretty_dio_logger: ^1.3.1
  shared_preferences: ^2.2.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  url_launcher: ^6.1.12
  device_info_plus: ^10.1.0
  lottie: ^3.1.2
  location: ^6.0.2
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  connectivity_plus: ^6.0.3
  change_app_package_name: ^1.5.0
  flutter_widget_from_html: ^0.16.0
  razorpay_flutter: ^1.4.0
  firebase_messaging: ^15.2.8
  connection_network_type: ^1.0.0
  maps_launcher: ^3.0.0+1
  flutter_inappwebview: ^6.1.0
  file_picker: ^10.2.0
  fluttertoast: ^8.2.12
  firebase_core: ^3.12.0
  awesome_notifications_fcm: ^0.10.1
  intl: ^0.20.2
  cloud_firestore: ^5.6.10
  awesome_notifications: ^0.10.1
  getwidget: ^7.0.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0
  flutter_local_notifications: ^21.0.0
  chuck_interceptor: ^2.4.1
  deep_route: ^0.0.5
  battery_plus: ^7.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png" # Used for iOS and older Android versions
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/raw/
    - assets/icon/
  fonts:
    - family: ProximaNova
      fonts:
        - asset: assets/fonts/ProximaNova-Bold.ttf
        - asset: assets/fonts/ProximaNova-Regular.ttf
        - asset: assets/fonts/ProximaNova-Semibold.ttf
        - asset: assets/fonts/ProximaNovaT-Thin.ttf
